name: Docker Image CI

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4.2.2
      
    - name: Log in to Docker Hub
      uses: docker/login-action@v3.3.0
      with:
        username: themaux # Nom d'utilisateur Docker Hub (stocké dans les secrets GitHub)
        password: ${{ secrets.DOCKER_PASSWORD }}  # Mot de passe Docker Hub (stocké dans les secrets GitHub)

    - name: Build the Docker image
      run: docker build -t themaux/chartboard:develop .

    - name: Push the Docker image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/${{ secrets.APP_NAME }}:develop
